# Builds signed per-ABI release APKs and publishes them as a GitHub Release.
# Trigger: pushing a version tag, e.g.
#   git tag v1.2.0 && git push origin v1.2.0
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of keys/gatekeeper-release.jks
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FLUTTER_VERSION: "3.47.5"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not of the form vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building GateKeeper $VERSION (build ${GITHUB_RUN_NUMBER})"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Signing secrets are missing. See the header of this workflow."
            exit 1
          fi
          mkdir -p keys
          echo "$KEYSTORE_BASE64" | base64 --decode > keys/gatekeeper-release.jks
          {
            echo "storeFile=gatekeeper-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keys/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: |
          flutter test
          cd android && ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build per-ABI release APKs
        env:
          REQUIRE_RELEASE_SIGNING: "true"
        run: >
          flutter build apk --release --split-per-abi
          --build-name=${{ steps.version.outputs.version }}
          --build-number=${{ github.run_number }}

      - name: Verify signatures and collect artifacts
        id: collect
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          mkdir -p dist
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            SRC="build/app/outputs/flutter-apk/app-${ABI}-release.apk"
            DEST="dist/gatekeeper-${VERSION}-${ABI}.apk"
            test -f "$SRC" || { echo "::error::Missing $SRC"; exit 1; }
            "$APKSIGNER" verify --print-certs "$SRC" | grep -q "CN=GateKeeper" \
              || { echo "::error::$SRC is not signed with the GateKeeper release key"; exit 1; }
            cp "$SRC" "$DEST"
            # Stable name for the website's direct ".../releases/latest/download/<file>" links.
            cp "$SRC" "dist/gatekeeper-${ABI}.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cat > release-notes.md <<EOF
          ## GateKeeper ${VERSION}

          Download the APK for your phone (most phones: **arm64-v8a**):

          | File | Devices |
          |---|---|
          | \`gatekeeper-${VERSION}-arm64-v8a.apk\` | Most phones from 2017 onwards (64-bit ARM) |
          | \`gatekeeper-${VERSION}-armeabi-v7a.apk\` | Older 32-bit ARM phones |
          | \`gatekeeper-${VERSION}-x86_64.apk\` | Emulators / x86 devices |

          The same APKs without the version in the name (\`gatekeeper-<abi>.apk\`) back the
          direct-download links on https://sanusanal.github.io/gatekeeper/.

          Already installed? Open GateKeeper → Settings → Updates → **Check for updates**.
          Verify downloads with \`SHA256SUMS.txt\`. Requires Android 11+.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "GateKeeper ${VERSION}" \
            --notes-file release-notes.md \
            --generate-notes \
            --verify-tag

      - name: Remove signing material
        if: always()
        run: rm -rf keys
